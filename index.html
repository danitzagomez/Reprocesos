<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Azul Oscuro</title>
    <style>
        body {
            background-color: #0a192f; /* Azul oscuro profundo */
            color: #e6f1ff;            /* Texto claro */
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            border-radius: 8px;
            background-color: #112240; /* Tono ligeramente más claro para contraste */
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
            max-width: 500px;
        }

        h1 {
            color: #64ffda; /* Detalle en tono turquesa/brillante */
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            color: #8892b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Página Azul Oscuro</h1>
        <p>Este es un diseño base con un tono azul de fondo y una tarjeta con un contraste suave para destacar el contenido.</p>
    </div>

</body>
</html>
