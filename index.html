<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invermar Reprocesos</title>
    <style>
        body {
            background-color: #0a192f; /* Azul oscuro profundo */
            color: #e6f1ff;            /* Texto claro */
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            border-radius: 12px;
            background-color: #112240; /* Tono de azul para la tarjeta */
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
            max-width: 600px;
            width: 90%;
            border: 1px solid #233554;
        }

        h1 {
            color: #64ffda; /* Tono turquesa destacado */
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #8892b0;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            line-height: 1.6;
            color: #ccd6f6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Invermar Reprocesos</h1>
        <p class="subtitle">Planta de Proceso</p>
        <p>Bienvenido al portal del área de Reprocesos. Desde aquí puedes acceder a la información, registros e informes de la planta.</p>
    </div>

</body>
</html>
