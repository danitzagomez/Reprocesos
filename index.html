<!DOCTYPE html><html lang="es"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Mi Página Web | GitHub Pages</title>  <style>    * {      box-sizing: border-box;      margin: 0;      padding: 0;      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;    }

    .btn:hover {      background-color: #2c974b;    }  </style></head><body>
  <div class="card">    <h1>¡Hola, mundo! 👋</h1>    <p>Esta es mi nueva página web alojada de forma gratuita con <strong>GitHub Pages</strong>.</p>    <a href="https://github.com" target="_blank" class="btn">Ver mi GitHub</a>  </div>
</body></html>
