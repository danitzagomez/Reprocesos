<!DOCTYPE html>
<html lang="es">
    <head>    
        <meta charset="UTF-8">    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">   
        <title>Invermar Reprocesos - Reprocesos Salar</title>    
        <!-- Librería para el gráfico -->    
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>    <style>      
            * {           
                box-sizing: border-box;           
                margin: 0;           
                padding: 0;            
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;      
            }
        body {         
            background-color: #0b192c; /* Azul oscuro */     
            color: #ffffff;         
            padding: 20px;     
            display: flex;   
            flex-direction: column;           
            align-items: center;           
            min-height: 100vh;     
        }
        header {         
            text-align: center;    
            margin-bottom: 30px;  
        }
        header h1 {     
            color: #4ea8de;    
            font-size: 1.5rem;   
            text-transform: uppercase;   
            letter-spacing: 2px;      
        }
        header h2 {         
            font-size: 2.5rem; 
            margin-top: 5px;     
            color: #f1f1f1;  
        }
        .cards-container {     
            display: grid;        
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));   
            gap: 20px;       
            width: 100%;    
            max-width: 1000px;         
            margin-bottom: 30px;       
        }
        .card {          
            background-color: #1e3e62;         
               border-radius: 12px;         
               padding: 25px;           
               text-align: center;         
               box-shadow: 0 4px 15px rgba(0,0,0,0.3);            
            border: 1px solid #005691;  
        }
        .card h3 {           
            font-size: 1.1rem;       
                  color: #90e0ef;          
            margin-bottom: 15px;  
        }
        .card .value {           
            font-size: 2rem;         
            font-weight: bold;    
            color: #ffffff;       
        }
        .input-section {          
            background-color: #1e3e62;     
            padding: 20px;           
            border-radius: 12px;    
            width: 100%;           
            max-width: 1000px;      
            margin-bottom: 30px;   
            display: flex;         
            gap: 15px;           
            justify-content: center; 
            align-items: center;     
            flex-wrap: wrap;       
        }
        .input-section label {    
            font-weight: bold;     
            color: #90e0ef;      
        }
        .input-section input {   
            padding: 10px;      
            border-radius: 6px; 
            border: 1px solid #4ea8de;         
            background-color: #0b192c;      
            color: #fff;           
            font-size: 1rem;
        }
        .input-section button { 
            padding: 10px 20px;         
            border-radius: 6px;           
            border: none;          
            background-color: #0077b6;    
            color: #fff;            
            font-size: 1rem;       
            font-weight: bold;     
            cursor: pointer;       
            transition: background 0.3s;    
        }
        .input-section button:hover {    
            background-color: #0096c7;  
        }
        .chart-container {           
            background-color: #1e3e62;     
            padding: 20px;           
            border-radius: 12px;      
            width: 100%;           
            max-width: 1000px;      
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);  
        }   
        </style>
    </head>
    <body>
    <header>    
        <h1>Invermar Reprocesos</h1>    
        <h2>Reprocesos Salar</h2>
    </header>
    <!-- Cuadros Principales -->    
        <div class="cards-container">  
            <div class="card">         
                <h3>Plan Total</h3>  
                <div class="value" id="planTotal">43.000 un.</div>  
            </div>        
            <div class="card">          
                <h3>Real Ingresado</h3>           
                <div class="value" id="realIngresado">0 un.</div>   
            </div>       
            <div class="card">     
                <h3>Cumplimiento</h3>       
                <div class="value" id="cumplimiento">0%</div>   
            </div> 
        </div>
    <!-- Formulario para ingreso diario -->  
        <div class="input-section">      
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha">     
            <label for="cantidad">Ingreso Diario (un):</label>     
            <input type="number" id="cantidad" placeholder="Ej. 5000">   
            <button onclick="agregarIngreso()">Registrar Ingreso</button> 
        </div>
    <!-- Gráfico de Barras -->  
        <div class="chart-container">   
        <canvas id="graficoBarras"></canvas> 
        </div>
    <script>       
        const PLAN_TOTAL = 43000; 
        let totalIngresado = 0;
        const fechas = [];     
        const datosIngresados = [];
        // Configuración Inicial del Gráfico       
        const ctx = document.getElementById('graficoBarras').getContext('2d');       
        const grafico = new Chart(ctx, {   
            type: 'bar',       
            data: {          
                labels: fechas, 
                datasets: [{      
                    label: 'Ingreso Diario (unidades)',       
                    data: datosIngresados,                 
                    backgroundColor: '#4ea8de',           
                    borderColor: '#90e0ef',             
                    borderWidth: 1           
                }]    
            },          
            options: {    
                responsive: true,       
                plugins: {                 
                    legend: { labels: { color: '#ffffff' } }     
                },              
                scales: {                   
                    x: { ticks: { color: '#ffffff' }, grid: { color: '#2b4c7e' } },     
                    y: { ticks: { color: '#ffffff' }, grid: { color: '#2b4c7e' }, beginAtZero: true }                
                }            
            }        
        });
        // Poner la fecha actual por defecto en el input    
        document.getElementById('fecha').valueAsDate = new Date();
        function agregarIngreso() {         
            const fechaInput = document.getElementById('fecha').value;       
            const cantidadInput = parseFloat(document.getElementById('cantidad').value);
            if (!fechaInput || isNaN(cantidadInput) || cantidadInput <= 0) {              
                alert("Por favor ingresa una fecha válida y una cantidad mayor a 0.");    
                return;            
            }
            // Actualizar Totales    
            totalIngresado += cantidadInput;   
            const porcentaje = ((totalIngresado / PLAN_TOTAL) * 100).toFixed(2);
            
            document.getElementById('realIngresado').innerText = totalIngresado.toLocaleString('es-CL') + " un.";           
            document.getElementById('cumplimiento').innerText = porcentaje + "%";
            // Actualizar Gráfico            
            fechas.push(fechaInput);    
            datosIngresados.push(cantidadInput);  
            grafico.update();
            // Limpiar Input            
            document.getElementById('cantidad').value = '';    
        }    
    </script>
    </body>
</html>
